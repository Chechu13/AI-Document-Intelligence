[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-document-intelligence"
version = "0.1.0"
description = "AI Document Intelligence foundation for receipt understanding"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas",
  "numpy",
  "scikit-learn",
  "matplotlib",
  "seaborn",
  "opencv-python",
  "pytesseract",
  "datasets",
  "transformers",
  "torch",
  "fastapi",
  "uvicorn",
  "streamlit",
  "pydantic",
  "ipykernel>=7.3.0",
]
